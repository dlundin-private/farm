<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lilla Byn</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-title" content="Lilla Byn">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#BFE6F7; --grass:#86C25A; --grass-dark:#5E9A3C; --tile:#9BD06C; --tile-hi:#A9DA7B;
  --soil:#A8713F; --soil-line:#93602F; --sun:#FFCF3A; --barn:#E0533D;
  --wood:#C98B4F; --wood-dark:#8E5A2B; --wood-ink:#FFF6E0;
  --panel:#FFFDF5; --panel-ink:#2F3B24; --card:#F2F0DF; --muted:#6B7556; --edge:#D9D3B6;
  --leaf:#3F9B4A; --leaf-dark:#2C7436; --bad:#C2412E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1D2848; --grass:#3E6B3E; --grass-dark:#26472A; --tile:#3D6E43; --tile-hi:#467C4C;
    --soil:#6E4B2C; --soil-line:#5C3E23; --sun:#FFD860; --barn:#F07259;
    --wood:#8F5F35; --wood-dark:#5E3B1C; --wood-ink:#FFF1D6;
    --panel:#28324C; --panel-ink:#F3F0DC; --card:#323E5C; --muted:#B7C0A8; --edge:#151C30;
    --leaf:#4CB25A; --leaf-dark:#2F7A3A; --bad:#FF8A73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#1D2848; --grass:#3E6B3E; --grass-dark:#26472A; --tile:#3D6E43; --tile-hi:#467C4C;
  --soil:#6E4B2C; --soil-line:#5C3E23; --sun:#FFD860; --barn:#F07259;
  --wood:#8F5F35; --wood-dark:#5E3B1C; --wood-ink:#FFF1D6;
  --panel:#28324C; --panel-ink:#F3F0DC; --card:#323E5C; --muted:#B7C0A8; --edge:#151C30;
  --leaf:#4CB25A; --leaf-dark:#2F7A3A; --bad:#FF8A73;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--sky);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--sky);color:var(--panel-ink);
  font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* Skylten med byns namn */
.top{padding:10px 12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sign{border:0;background:var(--wood);color:var(--wood-ink);font-weight:800;font-size:28px;line-height:1.1;
  padding:6px 22px 4px;border-radius:10px;box-shadow:0 5px 0 var(--wood-dark);transform:rotate(-1.5deg);
  max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.hud{display:flex;gap:8px;width:100%;align-items:center}
.pill{background:var(--panel);color:var(--panel-ink);border:0;border-radius:999px;padding:3px 12px;font-weight:800;
  display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--edge);font-size:17px;white-space:nowrap}
.pill.level{flex:1;min-width:0}
.xpbar{flex:1;height:10px;border-radius:5px;background:var(--card);overflow:hidden;min-width:40px}
.xpbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:5px;transition:width .4s}

main{flex:1;overflow:auto;padding:8px 12px 10px;-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--grass-dark);padding:6px;border-radius:22px;
  box-shadow:inset 0 0 0 4px var(--grass)}
.tile{aspect-ratio:1;border:0;border-radius:12px;background:var(--tile);position:relative;padding:0;
  font-size:clamp(24px,8vw,38px);display:grid;place-items:center;line-height:1}
.tile:nth-child(odd){background:var(--tile-hi)}
.tile.soil{background:var(--soil);background-image:repeating-linear-gradient(0deg,transparent 0 7px,var(--soil-line) 7px 10px)}
.tile .e{display:block;transition:transform .15s}
.tile:active .e{transform:scale(.88)}
.tile.ready .e{animation:bob 1.1s ease-in-out infinite}
.tile .bar{position:absolute;left:10%;right:10%;bottom:8%;height:6px;border-radius:3px;background:rgba(0,0,0,.28);overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--sun)}
.badge{position:absolute;top:-5px;right:-5px;font-size:.5em;background:var(--panel);border-radius:999px;padding:2px 4px;
  box-shadow:0 2px 0 var(--edge);line-height:1}
.ready .badge{animation:bob 1s ease-in-out infinite}
.placing .tile.empty{box-shadow:inset 0 0 0 3px var(--sun)}
.tile.sel{box-shadow:inset 0 0 0 4px var(--barn)}
.editing .tile:not(.empty){opacity:.92}

.banner{margin:0 12px 8px;background:var(--sun);color:#3A2A00;border-radius:14px;padding:6px 8px 6px 14px;
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;line-height:1.2}
.banner span{flex:1}
.banner button{border:0;border-radius:10px;background:#3A2A00;color:#FFF6E0;font-weight:800;padding:4px 12px}
.banner button.red{background:var(--bad);color:#fff}

.dock{display:flex;gap:8px;padding:6px 12px 10px}
.dock button{flex:1;border:0;border-radius:16px;background:var(--panel);font-weight:800;font-size:15px;padding:6px 2px 4px;
  box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;line-height:1.15;position:relative}
.dock button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dock .ico{font-size:24px}
.dot{position:absolute;top:2px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--barn);color:#fff;
  font-size:13px;display:grid;place-items:center;padding:0 5px}

/* Ark som glider upp */
.scrim{position:fixed;inset:0;background:rgba(10,20,10,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--panel);color:var(--panel-ink);
  border-radius:26px 26px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;z-index:21;
  animation:up .22s ease-out}
.sheet h2{margin:0 0 2px;font-size:26px;line-height:1.15}
.sheet p{margin:4px 0 12px;color:var(--muted);font-size:16px;line-height:1.35}
.grab{width:44px;height:5px;border-radius:3px;background:var(--edge);margin:0 auto 10px}
.x{float:right;border:0;background:var(--card);border-radius:999px;width:36px;height:36px;font-size:18px;font-weight:800}
.tabs{display:flex;gap:6px;margin:8px 0 10px;overflow-x:auto}
.tabs button{border:0;border-radius:999px;padding:4px 14px;background:var(--card);font-weight:800;font-size:15px;white-space:nowrap}
.tabs button.on{background:var(--leaf);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:8px 10px;margin-bottom:8px}
.row .big{font-size:34px;width:44px;text-align:center;flex:none}
.row .txt{flex:1;min-width:0;line-height:1.2}
.row .txt b{font-size:18px;display:block}
.row .txt small{color:var(--muted);font-size:14px}
.row.locked{opacity:.55}
.btns{display:flex;flex-direction:column;gap:6px;flex:none}
.btn{border:0;border-radius:12px;background:var(--leaf);color:#fff;font-weight:800;padding:5px 14px;font-size:16px;
  box-shadow:0 3px 0 var(--leaf-dark);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dark)}
.btn.soft{background:var(--panel);color:var(--panel-ink);box-shadow:0 3px 0 var(--edge)}
.btn:disabled{opacity:.4;transform:none}
.btn.wide{width:100%;padding:10px;font-size:19px}
.need{display:inline-flex;gap:3px;margin-right:8px;font-weight:700;font-size:15px;color:var(--panel-ink)}
.need.short{color:var(--bad)}
.order{background:var(--card);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.order .items{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.order .it{background:var(--panel);border-radius:12px;padding:2px 10px;font-weight:800;font-size:17px}
.order .it.short{color:var(--bad)}
.order .foot{display:flex;align-items:center;gap:8px}
.order .reward{flex:1;font-weight:800;font-size:17px}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.inv{background:var(--card);border-radius:14px;padding:6px;text-align:center;line-height:1.1}
.inv .big{font-size:30px}
.inv b{display:block;font-size:18px}
.inv small{color:var(--muted);font-size:13px}
.job{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.job .big{font-size:34px}
.job .meter{height:10px;border-radius:5px;background:var(--panel);overflow:hidden;margin-top:4px}
.job .meter i{display:block;height:100%;background:var(--sun)}
.steps{margin:0 0 14px;padding-left:22px;font-size:17px;line-height:1.4}
.steps li{margin-bottom:4px}
input.name{width:100%;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--edge);border-radius:14px;padding:6px 12px;
  background:var(--card);color:var(--panel-ink);margin-bottom:12px;user-select:text;-webkit-user-select:text}
.party{text-align:center}
.party .burst{font-size:64px;line-height:1;margin:6px 0}
.party h2{font-size:34px}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 16px}
.unl span{background:var(--card);border-radius:12px;padding:4px 10px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);background:var(--panel);
  color:var(--panel-ink);padding:8px 16px;border-radius:14px;font-weight:700;box-shadow:0 4px 0 var(--edge);z-index:40;
  transition:transform .25s;max-width:90%;text-align:center;line-height:1.25}
.toast.show{transform:translate(-50%,0)}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);
  transform:translate(-50%,0);animation:floatup 1s ease-out forwards;z-index:30;white-space:nowrap}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-48px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.tile.raw{background:var(--soil);background-image:radial-gradient(circle at 25% 30%,var(--soil-line) 0 3px,transparent 4px),radial-gradient(circle at 70% 60%,var(--soil-line) 0 4px,transparent 5px),radial-gradient(circle at 40% 80%,var(--soil-line) 0 2px,transparent 3px)}
.badge.l{right:auto;left:-5px}
.done{color:var(--leaf);font-weight:800;white-space:nowrap}
[hidden]{display:none!important}

/* Föräldraläge */
.pill.timer.low{background:var(--sun);color:#3A2A00}
.lock{position:fixed;inset:0;z-index:50;background:var(--sky);overflow:auto;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lock .card{background:var(--panel);color:var(--panel-ink);border-radius:26px;padding:18px 16px;max-width:520px;width:100%;
  margin:auto 0;box-shadow:0 6px 0 var(--edge);animation:up .22s ease-out}
.lock h2{margin:0 0 2px;font-size:30px;line-height:1.15}
.lock p{margin:4px 0 12px;color:var(--muted);font-size:16px;line-height:1.35}
.lbl{display:block;font-weight:800;font-size:17px;margin:6px 0 4px}
.err{color:var(--bad)!important;font-weight:700;margin:-4px 0 12px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:0;border-radius:999px;padding:6px 14px;background:var(--card);font-weight:800;font-size:16px}
.chips button.on{background:var(--leaf);color:#fff}
.row.pick{cursor:pointer}
.tick{width:32px;height:32px;border-radius:10px;border:3px solid var(--edge);display:grid;place-items:center;font-weight:800;flex:none}
.pick.on .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input{margin:0;flex:1;min-width:0}
input.code{letter-spacing:.3em}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="sign" id="sign" data-act="rename" aria-label="Byt namn på byn"></button>
    <div class="hud">
      <div class="pill level" aria-label="Nivå"><span>⭐</span><b id="lvl">1</b><span class="xpbar"><i id="xp"></i></span></div>
      <div class="pill" aria-label="Mynt">🪙 <b id="coins">0</b></div>
      <div class="pill timer" id="ptime" aria-label="Speltid kvar" hidden></div>
      <button class="pill" id="snd" data-act="sound" aria-label="Ljud">🔊</button>
    </div>
  </div>
  <main><div class="board" id="board"></div></main>
  <div id="banner"></div>
  <nav class="dock">
    <button data-act="orders"><span class="ico">📋</span>Order<span class="dot" id="odot" hidden></span></button>
    <button data-act="shop"><span class="ico">🔨</span>Bygg</button>
    <button data-act="inv"><span class="ico">📦</span>Lager</button>
    <button data-act="edit"><span class="ico">✋</span>Flytta</button>
  </nav>
</div>
<div id="sheetWrap" hidden><div class="scrim" data-act="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="lock" id="lock" role="dialog" aria-modal="true" hidden></div>

/* Automatik som körs varje sekund, och ikapp efter att spelet varit stängt */
function process(){
  const T=now();
  S.tiles.forEach((t,i)=>{if(!t)return;const b=B[t.k];
    if(b.t==='field'){
      for(let n=0;n<60&&S.up.skord&&t.job&&t.job.end<=T;n++)harvestTile(i,t.job.end);
      if(!t.job&&t.raw&&S.up.plog)t.raw=false;
      if(!t.job&&!t.raw&&S.up.sa&&t.last&&CROPS[t.last])plantTile(i,t.last,T);
      if(t.job&&T<t.job.end&&!t.job.w&&covered(i))water(t,T);
    }
    if(b.t==='animal'&&S.up.djur){const f=food(b);
      for(let n=0;n<60&&t.job&&t.job.end<=T;n++){const at=t.job.end;add(b.out,2);addXP(2);t.job=null;
        if(has(f)>=1){S.inv[f]--;t.job={start:at,end:at+b.time*1000}}}
      if(!t.job&&has(f)>=1){S.inv[f]--;t.job={start:T,end:T+b.time*1000}}
    }
    if(b.t==='factory'&&S.up.fabrik){
      for(let n=0;n<60&&t.job&&t.job.end<=T;n++){const r=R[t.job.r],at=t.job.end;add(r.out,r.q);addXP(Math.max(2,Math.round(val(r.out)/4)));t.job=null;
        if(t.rep&&enough(R[t.rep])){use(R[t.rep]);t.job={r:t.rep,start:at,end:at+R[t.rep].t*1000}}}
      if(!t.job&&t.rep&&enough(R[t.rep])){use(R[t.rep]);t.job={r:t.rep,start:T,end:T+R[t.rep].t*1000}}
    }
    if(b.t==='house'&&S.up.hyra&&T>=t.next){const p=Math.min(60,Math.floor((T-t.next)/(b.every*1000))+1);S.coins+=b.rent*p;t.next+=p*b.every*1000;if(t.next<T)t.next=T+b.every*1000}
  });
}
const enough=r=>Object.entries(r.in).every(([k,q])=>has(k)>=q);
const use=r=>Object.entries(r.in).forEach(([k,q])=>S.inv[k]-=q);

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function float(i,txt){
  const el=document.createElement('div');el.className='float';el.textContent=txt;
  let x=innerWidth/2,y=innerHeight/2;
  if(i!=null&&tiles[i]){const r=tiles[i].getBoundingClientRect();x=r.left+r.width/2;y=r.top}
  el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
}

const board=$('#board');let tiles=[],last=[];
function buildBoard(){board.innerHTML='';tiles=[];last=[];
  for(let i=0;i<N();i++){const b=document.createElement('button');b.className='tile';b.dataset.i=i;board.appendChild(b);tiles.push(b)}}
function pct(j){return Math.min(100,Math.max(0,(now()-j.start)/(j.end-j.start)*100))}
function tileView(i){
  const t=S.tiles[i],T=now();let cls='tile',e='',badge='',lbadge='',bar='',label='Tom gräsruta';
  if(!t){cls+=' empty'}
  else{const b=B[t.k];label=b.n;
    if(b.t==='field'){
      if(t.job){cls+=' soil';
        if(T<t.job.end){e='🌱';bar=pct(t.job);label=nm(t.job.item)+' växer';if(t.job.w)lbadge='💧'}
        else{e=em(t.job.item);cls+=' ready';label=nm(t.job.item)+' redo att skördas'}}
      else if(t.raw){cls+=' raw';badge='⛏️';label='Åker som behöver plöjas'}
      else{cls+=' soil';label='Plöjd åker, redo att så'}}
    else if(b.t==='animal'){e=b.e;
      if(!t.job){badge='💤';label=b.n+', hungriga'}else if(T<t.job.end)bar=pct(t.job);else{badge=em(b.out);cls+=' ready';label=b.n+', '+nm(b.out)+' redo'}}
    else if(b.t==='factory'){e=b.e;if(t.job){if(T<t.job.end)bar=pct(t.job);else{badge=em(R[t.job.r].out);cls+=' ready'}}}
    else if(b.t==='house'){e=b.e;if(T>=t.next){badge='🪙';cls+=' ready';label=b.n+', hyra redo'}}
    else e=b.e;
  }
  if(mode&&mode.type==='edit'&&mode.sel===i)cls+=' sel';
  const html=`<span class="e">${e}</span>${bar!==''?`<span class="bar"><i style="width:${bar.toFixed(0)}%"></i></span>`:''}${badge?`<span class="badge">${badge}</span>`:''}${lbadge?`<span class="badge l">${lbadge}</span>`:''}`;
  return {cls,html,label};
}
function render(){

  $('#sign').textContent=S.name;
  $('#lvl').textContent=S.level;

  let ban='';

function changed(){save();render()}

board.addEventListener('click',e=>{const b=e.target.closest('.tile');if(b&&!(P.on&&P.locked))tap(+b.dataset.i)});
function sumFloat(i,got){const s=Object.entries(got).map(([k,q])=>'+'+q+' '+em(k)).join('  ');if(s)float(i,s)}
function tap(i){
  const t=S.tiles[i],T=now();
  if(mode&&mode.type==='place'){
    if(t){sfx('no');toast('Välj en tom grön ruta');return}
    const k=mode.k,c=cost(k),b=B[k];
    if(S.coins<c){sfx('no');toast('Du behöver fler mynt 🪙');mode=null;render();return}
    S.coins-=c;S.tiles[i]={k};if(b.t==='house')S.tiles[i].next=T+b.every*1000;
    float(i,'-'+c+' 🪙');sfx('build');if(b.xp)addXP(b.xp);
    if(!(b.t==='field'||b.t==='deco'||b.t==='sprinkler')||S.coins<cost(k))mode=null;
    changed();return;
  }
  if(mode&&mode.type==='edit'){
    sfx('tap');
    if(mode.sel==null){if(t)mode.sel=i}
    else if(mode.sel===i)mode.sel=null;
    else if(!t){S.tiles[i]=S.tiles[mode.sel];S.tiles[mode.sel]=null;mode.sel=null;save()}
    else mode.sel=i;
    render();return;
  }
  if(!t)return;
  const b=B[t.k];
  if(b.t==='field'){
    if(t.job&&T>=t.job.end){
      const got={};area(i,f=>f.k==='falt'&&f.job&&T>=f.job.end).forEach(j=>{const k=harvestTile(j,T);got[k]=(got[k]||0)+2});
      sumFloat(i,got);sfx('harvest');changed();return;
    }
    if(t.job){
      if(!t.job.w){const js=area(i,f=>f.k==='falt'&&f.job&&T<f.job.end&&!f.job.w);js.forEach(j=>water(S.tiles[j],T));float(i,'💧'+(js.length>1?' ×'+js.length:''));sfx('water');changed();return}
      sfx('tap');return toast(em(t.job.item)+' '+nm(t.job.item)+' är klar om '+fmt(t.job.end-T));
    }
    if(t.raw){
      const js=area(i,f=>f.k==='falt'&&!f.job&&f.raw);
      js.forEach(j=>{const f=S.tiles[j];f.raw=false;if(S.up.sa&&f.last)plantTile(j,f.last,T)});
      float(i,'⛏️'+(js.length>1?' ×'+js.length:''));sfx('plow');changed();return;
    }
    sfx('tap');return openSheet(seedsHTML,{i});
  }
  sfx('tap');
  if(b.t==='sprinkler')return toast(b.e+' '+b.n+' vattnar åkrarna '+(b.r===1?'runt omkring':'i en stor ring'));
  if(b.t==='animal'){const f=food(b);
    if(!t.job){
      if(has(f)<1){sfx('no');toast(f==='foder'?'Djuren är hungriga! Gör 🥣 foder i Foderfabriken.':'Bina vill ha '+em(f)+' '+nm(f).toLowerCase()+'.');return}
      S.inv[f]--;t.job={start:T,end:T+b.time*1000};float(i,'-1 '+em(f));sfx('animal');changed();return;
    }
    if(T<t.job.end)return toast(b.n+': klart om '+fmt(t.job.end-T));
    add(b.out,2);t.job=null;float(i,'+2 '+em(b.out));sfx('harvest');addXP(2);
    if(S.up.djur&&has(f)>=1){S.inv[f]--;t.job={start:T,end:T+b.time*1000}}
    changed();return;
  }
  if(b.t==='factory'){
    if(t.job&&T>=t.job.end){collectFactory(i);return}
    return openSheet(factoryHTML,{i});
  }
  if(b.t==='house'){
    if(T<t.next)return toast('Hyran kommer om '+fmt(t.next-T));
    S.coins+=b.rent;t.next=T+b.every*1000;float(i,'+'+b.rent+' 🪙');sfx('coin');changed();return;
  }
  toast(b.e+' '+b.n);
}
function collectFactory(i){
  const t=S.tiles[i],r=R[t.job.r],T=now();add(r.out,r.q);t.job=null;
  float(i,'+'+r.q+' '+em(r.out));sfx('harvest');addXP(Math.max(2,Math.round(val(r.out)/4)));
  if(S.up.fabrik&&t.rep&&enough(R[t.rep])){use(R[t.rep]);t.job={r:t.rep,start:T,end:T+R[t.rep].t*1000}}
  changed();
}

const LOUD=new Set(['plant','plantall','make','collect','deliver','upgrade','remove','lockTry','sndToggle']);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(P.on&&P.locked&&!a.closest('#lock'))return;
  const arg=a.dataset.arg,T=now();
  if(!LOUD.has(a.dataset.act))sfx('tap');
  switch(a.dataset.act){
    case 'sound':openSheet(soundHTML);break;
    case 'sndToggle':A[arg]=!A[arg];saveA();audio();syncMusic();sfx('tap');render();break;
    case 'lockOpen':lockCtx={open:true};renderLock();break;
    case 'lockTry':{const err=tryCode(($('#lockIn').value||'').trim());
      if(err){sfx('no');lockCtx={open:true,err};renderLock();break}
      P.locked=false;P.left=P.mins*60000;P.tick=now();saveP();lockCtx={};renderLock();render();sfx('unlock');syncMusic();toast('🎉 '+minTxt(P.mins)+' till att spela!');break}
    case 'parent':openSheet(P.on?parentCodeHTML:parentHTML,P.on?{code:'',err:''}:parentDraft());break;
    case 'pCode':{const err=tryCode((sheetCtx.code||'').trim());
      if(err){sheetCtx.err=err;sheetCtx.code='';render();break}
      openSheet(parentHTML,parentDraft());break}
    case 'pMins':sheetCtx.mins=+arg;render();break;
    case 'pPick':{const s=sheetCtx.sel,ix=s.indexOf(arg);if(ix<0)s.push(arg);else s.splice(ix,1);render();break}
    case 'pDel':sheetCtx.custom=sheetCtx.custom.filter(x=>x.id!==arg);sheetCtx.sel=sheetCtx.sel.filter(x=>x!==arg);render();break;
    case 'pAdd':{const v=(sheetCtx.newAct||'').trim();if(!v)break;const id='c'+T;
      sheetCtx.custom.push({id,e:'⭐',t:v});sheetCtx.sel.push(id);sheetCtx.newAct='';render();break}
    case 'pSave':{const c=sheetCtx,first=!P.on;let err='';
      if(first||c.code||c.code2){if(!/^\d{4,8}$/.test(c.code))err='Koden ska vara 4–8 siffror.';else if(c.code!==c.code2)err='Koderna är inte likadana. Skriv dem igen.'}
      if(!err&&!c.sel.length)err='Välj minst en aktivitet.';
      if(err){c.err=err;render();break}
      if(c.code)P.code=c.code;
      if(first||c.mins!==P.mins)P.left=c.mins*60000;
      P.on=true;P.locked=false;P.mins=c.mins;P.sel=[...c.sel];P.custom=c.custom;P.tick=now();saveP();
      closeSheet();render();toast(first?'👪 Föräldraläget är på. Speltid: '+minTxt(P.mins):'Inställningarna är sparade');break}
    case 'pFull':P.left=P.mins*60000;saveP();closeSheet();render();toast('⏳ Full speltid: '+minTxt(P.mins));break;
    case 'pOff':P.on=false;P.locked=false;saveP();closeSheet();render();toast('Föräldraläget är avstängt');break;
    case 'close':closeSheet();if(pendingUps)setTimeout(showLevelUp,200);break;
    case 'shop':mode=null;openSheet(shopHTML,{cat:'gard'});break;
    case 'tab':sheetCtx.cat=arg;render();break;
    case 'inv':openSheet(invHTML);break;
    case 'orders':openSheet(ordersHTML);break;
    case 'edit':closeSheet();mode={type:'edit',sel:null};render();break;
    case 'done':mode=null;render();break;
    case 'buy':closeSheet();mode={type:'place',k:arg};render();break;
    case 'upgrade':{const u=UP[arg];let c;
      if(u.tiers){const lv=arg==='mark'?S.rows-9:(S.up[arg]||0);const tr=u.tiers[lv];if(!tr||tr.lvl>S.level)break;c=tr.cost;if(S.coins<c)break;S.coins-=c;
        sfx('build');if(arg==='mark'){S.rows++;for(let n=0;n<COLS;n++)S.tiles.push(null);toast('🗺️ Byn fick en ny rad med mark!')}else{S.up[arg]=lv+1;toast(u.e+' '+tr.n+' är din!')}}
      else{if(S.up[arg]||u.lvl>S.level||S.coins<u.cost)break;S.coins-=u.cost;S.up[arg]=true;sfx('build');toast(u.e+' '+u.n+' är på plats!');process()}
      changed();break}
    case 'remove':{const t=S.tiles[mode.sel],back=Math.floor(B[t.k].cost/2);S.tiles[mode.sel]=null;S.coins+=back;sfx('plow');toast('Borttagen, du fick tillbaka '+back+' 🪙');mode.sel=null;changed();break}
    case 'plant':{const js=area(sheetCtx.i,f=>f.k==='falt'&&!f.job&&!f.raw);js.forEach(j=>plantTile(j,arg,T));sfx('plant');float(sheetCtx.i,em(arg)+(js.length>1?' ×'+js.length:''));closeSheet();changed();break}
    case 'plantall':{let n=0;S.tiles.forEach((t,j)=>{if(t&&t.k==='falt'&&!t.job&&!t.raw){plantTile(j,arg,T);n++}});sfx('plant');toast('Sådde '+em(arg)+' på '+n+' åkrar');closeSheet();changed();break}
    case 'make':{const t=S.tiles[sheetCtx.i],r=R[arg];if(t.job||!enough(r))break;use(r);t.job={r:arg,start:T,end:T+r.t*1000};t.rep=arg;sfx('make');changed();break}
    case 'collect':collectFactory(sheetCtx.i);break;
    case 'deliver':{const o=S.orders[+arg];if(!canDeliver(o))break;
      Object.entries(o.items).forEach(([k,q])=>S.inv[k]-=q);S.coins+=o.coins;S.orders[+arg]=newOrder();sfx('deliver');
      float(null,'+'+o.coins+' 🪙  +'+o.xp+' ⭐');addXP(o.xp);changed();break}
    case 'swap':S.orders[+arg]=newOrder();changed();break;
    case 'rename':openSheet(renameHTML,{sure:false});break;
    case 'saveName':case 'start':{const v=($('#nameIn').value||'').trim();if(v)S.name=v;S.seen=true;S.news=3;closeSheet();changed();break}
    case 'reset':if(!sheetCtx.sure){sheetCtx.sure=true;render()}else{S=fresh();while(S.orders.length<3)S.orders.push(newOrder());S.seen=true;mode=null;closeSheet();changed();toast('En ny by väntar!')}break;
  }
});
/* Textfält i ark: spara värdet i sheetCtx så att det överlever omritning, utan att rita om medan man skriver */
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;
  if(f&&sheetFn&&e.target.closest('#sheet')){sheetCtx[f]=e.target.value;$('#sheet')._h=sheetHead()+sheetFn(sheetCtx)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){const b=document.querySelector('[data-act="'+e.target.dataset.enter+'"]');if(b){e.preventDefault();b.click()}return}
  if(e.key===' '&&e.target.classList&&e.target.classList.contains('pick')){e.preventDefault();e.target.click();return}
  if(P.on&&P.locked)return;
  if(e.key==='Escape'){if(!$('#sheetWrap').hidden)closeSheet();else{mode=null;render()}}});

process();
setInterval(()=>{process();tickParent();render()},1000);
setInterval(save,5000);
render();renderLock();
if(!S.seen)openSheet(welcomeHTML);
else if(S.news!==3){S.news=3;save();openSheet(newsHTML)}
</script>
